name: Publish PowerLink HACS integration
on:
  push:
    branches: [main]
    paths:
      - 'custom_components/powerlink/manifest.json'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: powerlink-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify current version and HACS layout
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('custom_components/powerlink/manifest.json').read_text())['version']
          assert version == '0.2.1', 'Only the reviewed PowerLink 0.2.1 is approved for this publication'
          hacs = json.loads(Path('hacs.json').read_text())
          assert hacs['content_in_root'] is False
          assert Path('custom_components/powerlink/__init__.py').is_file()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=v' + version + '\n')
          PY
      - name: Validate integration before publication
        run: |
          python -m compileall -q custom_components/powerlink tests
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish 0.2.1 tag and release for HACS
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "PowerLink $RELEASE_TAG already published; no overwrite"
            exit 0
          fi
          cat > /tmp/powerlink-release-notes.md <<'EOF'
          # PowerLink v0.2.1 — Destination wake reliability

          ## Changes in this release

          - Before each authenticated ADB destination handoff, wake the Fire TV using Android's non-toggle WAKEUP command, then dismiss the screensaver with HOME.
          - Launch the same PowerPlay transfer deep link immediately afterward; the source Fire Stick is not disturbed by this preflight.
          - Preserve configured wake scripts, exact Plex queue and position, quality matching and pause-on-confirmed-destination behavior.
          - Keep optional script-based destination launches unchanged; never automatically force-stop PowerPlay.

          ## Compatibility

          **Companion:** [PowerPlay v1.3.10](https://github.com/The-Power-0/PowerPlay/releases/tag/powerplay-v1.3.10) includes a temporary screen-awake hold while the destination resolves the queue and initializes the player. Update PowerPlay to v1.3.10 after updating this Home Assistant integration.

          Install or update PowerLink through HACS and restart Home Assistant. Existing registered devices and pairing remain intact.

          GPLv3 derivative and existing source notices remain unchanged.
          EOF
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest --title 'PowerLink v0.2.1 — Destination wake reliability' \
            --notes-file /tmp/powerlink-release-notes.md
