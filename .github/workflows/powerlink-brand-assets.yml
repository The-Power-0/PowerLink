name: Render approved PowerLink brand assets
on:
  push:
    branches:
      - 'branding/powerlink-v1.0.2-approved-svg'
    paths:
      - 'assets/brand/powerlink-mark.svg'
      - 'scripts/branding/render_powerlink.py'
      - '.github/workflows/powerlink-brand-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.ref == 'refs/heads/branding/powerlink-v1.0.2-approved-svg'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install release-time SVG renderer only
        run: python -m pip install --disable-pip-version-check 'CairoSVG==2.8.2' 'Pillow==12.3.0'
      - name: Render all SVG and lossless 256/512 icon + 432/864 logo PNG exports
        run: python scripts/branding/render_powerlink.py
      - name: Discard outdated branding variants
        run: |
          git rm -f --ignore-unmatch \
            assets/brand/powerlink-mark-light.svg \
            assets/brand/powerlink-mark-monochrome.svg \
            custom_components/powerlink/brand/dark_icon.png \
            custom_components/powerlink/brand/dark_icon@2x.png \
            custom_components/powerlink/brand/dark_logo.png \
            custom_components/powerlink/brand/dark_logo@2x.png
      - name: Verify SVG source/PNG checksums and size
        run: python scripts/branding/render_powerlink.py --verify
      - name: Commit generated assets to the release branch
        run: |
          git add assets/brand/powerlink-app-icon.svg assets/brand/powerlink-banner.svg assets/brand/powerlink-lockup.svg
          git add custom_components/powerlink/brand/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Generate PowerLink v1.0.2 brand assets from approved SVG'
            git push origin HEAD:branding/powerlink-v1.0.2-approved-svg
          fi
