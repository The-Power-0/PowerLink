name: Stage PowerLink branding PNGs (review branch only)
on:
  push:
    branches:
      - 'branding/powerlink-v1.0.0'
    paths:
      - 'branding/**'
      - 'tools/render_brand.py'
      - '.github/workflows/powerlink-brand-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    if: github.ref == 'refs/heads/branding/powerlink-v1.0.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'cairosvg>=2.7,<3' 'Pillow>=11,<13'
      - run: python tools/render_brand.py
      - name: Commit generated PNGs only to the review branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add custom_components/powerlink/brand
          if ! git diff --cached --quiet; then
            git commit -m "brand: render PowerLink integration icons"
            git push origin HEAD:branding/powerlink-v1.0.0
          fi
