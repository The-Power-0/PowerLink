name: PowerLink 1.0.2 HACS Release Candidate (unpublished)
on:
  push:
    branches:
      - 'branding/powerlink-v1.0.2-approved-svg'
    paths:
      - 'custom_components/powerlink/brand/**'
      - '.github/workflows/powerlink-release-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    if: github.ref == 'refs/heads/branding/powerlink-v1.0.2-approved-svg'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify integration and approved artwork
        run: |
          python -m compileall -q custom_components/powerlink tests
          python -m unittest discover -s tests -p 'test_*.py' -q
          python -m pip install --disable-pip-version-check 'CairoSVG==2.8.2' 'Pillow==12.3.0'
          python scripts/branding/render_powerlink.py --verify
      - name: Package reviewed integration and SVG masters
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          base = Path('custom_components/powerlink')
          assert json.loads((base / 'manifest.json').read_text())['version'] == '1.0.2'
          brand = base / 'brand'
          for name in ('icon.png', 'icon@2x.png', 'logo.png', 'logo@2x.png'):
              assert (brand / name).read_bytes().startswith(bytes.fromhex('89504e470d0a1a0a'))
          release = Path('powerlink-candidate')
          release.mkdir(exist_ok=True)
          target = release / 'PowerLink-v1.0.2-rc1.zip'
          sources = [p for p in base.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix != '.pyc']
          extras = [Path('README.md'), Path('LICENSE'), Path('.github/powerlink/release-notes/v1.0.2.md')]
          extras += sorted(Path('assets/brand').glob('*.svg'))
          with ZipFile(target, 'w', ZIP_DEFLATED, compresslevel=9) as z:
              for path in sources + extras:
                  z.write(path, path.as_posix())
          (release / 'SHA256SUMS.txt').write_text(hashlib.sha256(target.read_bytes()).hexdigest() + '  ' + target.name + chr(10))
          (release / 'STATUS.txt').write_text('PowerLink v1.0.2 review candidate — approved branding, not published' + chr(10))
          print(target, target.stat().st_size, len(sources), 'integration files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PowerLink-v1.0.2-rc1-Review
          path: powerlink-candidate/
          if-no-files-found: error
