discover_devices:
  name: Discover compatible devices
  description: List existing Home Assistant Android TV / Fire TV media players without polling or scanning the network.
register_device:
  name: Register or update a PowerLink device
  description: Configure capabilities, launch adapter and optional wake routine for one device.
  fields:
    entity_id:
      required: true
      example: media_player.living_room_fire_tv_stick_4k_plus
      selector:
        entity:
          domain: media_player
    name:
      example: Living Room
      selector:
        text:
    max_height:
      required: true
      example: 2160
      selector:
        select:
          options: ["480", "720", "1080", "1440", "2160", "4320"]
    launch_method:
      example: adb
      selector:
        select:
          options: ["adb", "script"]
    launch_script:
      example: script.powerlink_wake_bedroom
      selector:
        entity:
          domain: script
    wake_steps:
      example: '[{"kind":"service","domain":"media_player","service":"turn_on","entity_id":"media_player.living_room_fire_tv_stick_4k_plus"}]'
      selector:
        object:
open_device:
  name: Wake device and open PowerPlay
  description: Execute this device's wake regimen and launch PowerPlay without changing the current queue.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: media_player
prepare_handoff:
  name: Prepare PowerLink handoff
  description: Validate an ordered PowerPlay queue snapshot, choose a destination copy and return a short-lived relay URL without launching playback.
  fields:
    destination:
      required: true
      example: media_player.bedroom_fire_tv_stick_lite
      selector:
        entity:
          domain: media_player
    snapshot:
      required: true
      selector:
        object:
handoff:
  name: Transfer playback to another PowerPlay device
  description: Wake the destination and launch the prepared queue. Requires a destination that supports the PowerLink v1 protocol (PowerPlay 1.3+).
  fields:
    destination:
      required: true
      selector:
        entity:
          domain: media_player
    snapshot:
      required: true
      selector:
        object:

capture_handoff:
  name: Capture and transfer current queue
  description: Ask a playing PowerPlay 1.3+ source for its exact current queue and playhead, prepare a compatible destination, then launch it without stopping the source.
  fields:
    source:
      required: true
      selector:
        entity:
          domain: media_player
    destination:
      required: true
      selector:
        entity:
          domain: media_player

powershuffle_list:
  name: List tracked PowerShuffle shows
  description: Return cycle completion and skip summaries for every tracked Plex profile and show.

powershuffle_manage:
  name: Manage PowerShuffle cycle
  description: Reset a stopped show rotation, clear five-day skips, or both. Does not change Plex watched status.
  fields:
    profile_id:
      required: true
      selector:
        text:
    show_guid:
      required: true
      selector:
        text:
    server_id:
      required: true
      selector:
        text:
    command:
      required: true
      selector:
        select:
          options:
            - reset_cycle
            - clear_cooldowns
            - reset_cycle_and_cooldowns

powershuffle_launch:
  name: Start PowerShuffle on a registered Fire Stick
  description: >-
    Start a previously tracked show's PowerShuffle rotation on a destination.
    If the show is currently playing elsewhere, use the verified PowerLink handoff.
    Use a title/device directly or supply existing Home Assistant selector helpers.
    If multiple Plex profiles track this title, specify profile_id.
  fields:
    show_title:
      example: King of the Hill
      selector:
        text:
    show_entity:
      example: input_select.plezy_shuffle_show
      selector:
        entity:
          domain: input_select
    destination:
      example: media_player.game_room_fire_tv_stick_lite
      selector:
        text:
    destination_entity:
      example: input_select.plezy_shuffle_fire_tv
      selector:
        entity:
          domain: input_select
    profile_id:
      example: plex-home-profile-id
      selector:
        text:
    server_id:
      example: plex-server-id
      selector:
        text:
